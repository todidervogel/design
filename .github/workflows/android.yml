# Baut eine installierbare APK-Datei.
# Starten: Repository → Actions → "APK bauen" → "Run workflow".
# Danach unten beim Lauf unter "Artifacts" die Datei "tellerrand-apk" herunterladen.
#
# Die APK ist ein Debug-Build und mit einem automatisch erzeugten Schlüssel
# signiert — zum Ausprobieren auf dem eigenen Gerät gedacht, nicht für den Store.
name: APK bauen

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - run: npm ci

      # Relative Pfade, weil die App die Dateien lokal aus dem Paket lädt
      - name: Weboberfläche bauen
        run: VITE_BASE=./ npm run build

      - name: In das Android-Projekt übernehmen
        run: npx cap sync android

      - name: APK bauen
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - name: Datei umbenennen
        run: mv android/app/build/outputs/apk/debug/app-debug.apk tellerrand-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tellerrand-apk
          path: tellerrand-debug.apk
          if-no-files-found: error

      # Zusätzlich als Vorab-Version veröffentlichen. Der Link darauf lädt die
      # APK direkt herunter — auf dem Handy bequemer als das ZIP der Artefakte.
      - name: Als Vorab-Version bereitstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: APK (letzter Build)
          body: |
            Debug-Build des Design-Prototyps.

            Auf dem Handy: `tellerrand-debug.apk` antippen, bei der Nachfrage
            das Installieren aus dieser Quelle erlauben.
          prerelease: true
          files: tellerrand-debug.apk
