# Baut den Prototyp und veröffentlicht ihn als Website auf GitHub Pages.
# Danach ist er unter https://<benutzer>.github.io/design/ vom Handy aus erreichbar.
#
# Einmalig nötig: Repository → Settings → Pages → Source: "GitHub Actions".
name: Website veröffentlichen

on:
  push:
    branches: ['claude/design-spec-screens-components-omyfb5', 'main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Der Pfad muss zum Repository-Namen passen: /<repo>/
      - name: Bauen
        run: VITE_BASE=/${{ github.event.repository.name }}/ npm run build

      # GitHub Pages liefert 404.html für unbekannte Pfade aus. Da der Prototyp
      # seine Routen selbst auflöst, genügt eine Kopie der Startseite, damit
      # Direktaufrufe wie /karte funktionieren.
      - name: Fallback für Unterseiten
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
