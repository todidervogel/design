# Veröffentlicht die Galerie als Website auf GitHub Pages.
# Danach ist sie unter https://<konto>.github.io/design/ auch am Handy zu sehen.
#
# Einmalig nötig: Settings → Pages → Source: "GitHub Actions".
name: Galerie veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Übersetzungen prüfen
        run: npm run pruefen:i18n

      # Der Pfad muss zum Repository-Namen passen: /<repo>/
      - name: Bauen
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
